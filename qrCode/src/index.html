<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body>
  <section class="text-gray-600 body-font relative">
  <div class="container px-5 py-24 mx-auto flex sm:flex-nowrap flex-wrap">
    <div class="lg:w-2/3 md:w-1/2 bg-gray-300 rounded-lg overflow-hidden sm:mr-10 p-10 flex items-center justify-center relative" id="qrResult">
    </div>
    <form id="qrForm">
       <div class=" bg-white flex flex-col w-full">
      <h2 class="text-gray-900 mb-1 font-bold text-4xl">QR CODE GENERATOR</h2>
      <p class="mb-5 text-gray-600 text-md font-medium">Turn your text , link or data into QR Code.</p>
      <div class="relative mb-4">
        <input type="text" id="name" name="name" placeholder="Enter the website url" class="mt-10 w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
      </div>
      <button class="mt-10 text-white bg-indigo-500 border-0 py-2 px-6 focus:outline-none hover:bg-indigo-600 rounded-4xl text-lg" type="submit">Generate</button>
    </div>
    </form>
  </div>
</section>
</body>
<script>
  const form = document.getElementById("qrForm");
  const input = document.getElementById("name");
  const qrResult = document.getElementById("qrResult");

  form.addEventListener("submit" , async (event) =>{

    event.preventDefault();

    const text = input.value.trim();

    if(!text){
      alert("Failed to generate QR code.");
      return;
    }

    const response = await fetch(`/qrCodeGen?text=${encodeURIComponent(text)}`);

    if (!response.ok) {
      alert("Failed to generate QR Code");
      return;
    }

    const imageBlob = await response.blob();
    
    const imageURL = URL.createObjectURL(imageBlob);

    qrResult.innerHTML = `<img src="${imageURL}" alt="Generated QR Code" class="w-48 h-48">`;

  });

</script>
</html>
